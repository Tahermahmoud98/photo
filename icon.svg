<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A67D8"/>
      <stop offset="50%" stop-color="#667EEA"/>
      <stop offset="100%" stop-color="#805AD5"/>
    </linearGradient>

    <!-- Studio Glow -->
    <radialGradient id="studioGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Lens Glass Gradient -->
    <linearGradient id="lensGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="50%" stop-color="#1A202C"/>
      <stop offset="100%" stop-color="#171923"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Aperture Core Reflection -->
    <linearGradient id="coreReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3182CE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#805AD5" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2D3748" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  <!-- Ambient Highlights -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#studioGlow)"/>

  <!-- Camera Top Flash Notch -->
  <rect x="206" y="70" width="100" height="28" rx="14" fill="#FFFFFF" opacity="0.9"/>

  <!-- Camera Outer Ring (Bezel) -->
  <circle cx="256" cy="268" r="150" fill="url(#ringGrad)" filter="url(#innerGlow)"/>
  <circle cx="256" cy="268" r="142" fill="#CBD5E0" opacity="0.5"/>

  <!-- Lens Outer Body -->
  <circle cx="256" cy="268" r="130" fill="url(#lensGrad)"/>

  <!-- Lens Inner Aperture Ring -->
  <circle cx="256" cy="268" r="95" fill="#2D3748"/>
  <circle cx="256" cy="268" r="90" fill="url(#coreReflect)"/>

  <!-- Camera Aperture Iris Blades Graphic -->
  <g stroke="#FFFFFF" stroke-width="2.5" opacity="0.35" fill="none">
    <path d="M 220 200 L 292 200"/>
    <path d="M 292 200 L 328 262"/>
    <path d="M 328 262 L 292 324"/>
    <path d="M 292 324 L 220 324"/>
    <path d="M 220 324 L 184 262 Z"/>
  </g>

  <!-- Deep Aperture Core -->
  <circle cx="256" cy="268" r="50" fill="#0F172A"/>

  <!-- Lens Glare / Reflections (Studio Look) -->
  <ellipse cx="225" cy="235" rx="36" ry="18" transform="rotate(-35 225 235)" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="285" cy="300" r="10" fill="#FFFFFF" opacity="0.35"/>

  <!-- Studio Flash / Sensor Indicator Light -->
  <circle cx="370" cy="145" r="18" fill="#F6E05E"/>
  <circle cx="370" cy="145" r="12" fill="#ECC94B"/>
  <circle cx="367" cy="142" r="5" fill="#FFFFFF" opacity="0.9"/>

  <!-- ID Badge Card Accent Bottom Right -->
  <g transform="translate(325, 335)" filter="url(#innerGlow)">
    <rect width="135" height="110" rx="20" fill="#FFFFFF"/>
    <rect x="14" y="16" width="36" height="44" rx="8" fill="#5A67D8"/>
    <rect x="58" y="20" width="62" height="8" rx="4" fill="#A0AEC0"/>
    <rect x="58" y="36" width="48" height="8" rx="4" fill="#CBD5E0"/>
    <rect x="14" y="74" width="106" height="18" rx="6" fill="#38A169"/>
    <text x="67" y="87" font-family="'Vazirmatn', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">HD STUDIO</text>
  </g>
</svg>
